name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint and typecheck
        run: scripts/verify.sh lint

  # backend-unit, frontend-unit, api-contract, e2e, and docker-build
  # are added when those projects exist. See the ci-pipeline skill.
