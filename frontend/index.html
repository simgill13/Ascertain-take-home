<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Ascertain</title>
    <script>
      // Light is the default; dark applies only when the visitor chose it with the toggle.
      // Runs before first paint so a saved dark preference does not flash light.
      try {
        if (localStorage.getItem('ascertain-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (storageError) {
        /* localStorage unavailable; stay light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
